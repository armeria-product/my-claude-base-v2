  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"\u003c!DOCTYPE html\u003e\n\u003chtml\u003e\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n\u003cscript src=\"f488706d-6ee9-4541-8b3e-7180d412e243\"\u003e\u003c/script\u003e\n\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n  \u003cstyle\u003e@font-face { font-family: 'Noto Sans JP'; font-style: normal; font-weight: 400; src: local('Yu Gothic'), local('YuGothic'), local('Meiryo'); }\n@font-face { font-family: 'Noto Sans JP'; font-style: normal; font-weight: 500; src: local('Yu Gothic Medium'), local('YuGothic-Medium'), local('Meiryo'); }\n@font-face { font-family: 'Noto Sans JP'; font-style: normal; font-weight: 700; src: local('Yu Gothic Bold'), local('YuGothic-Bold'), local('Meiryo'); }\n@font-face { font-family: 'Noto Sans JP'; font-style: normal; font-weight: 900; src: local('Yu Gothic Bold'), local('YuGothic-Bold'), local('Meiryo'); }\n@font-face { font-family: 'Noto Serif JP'; font-style: normal; font-weight: 600; src: local('Yu Mincho Demibold'), local('YuMincho-Demibold'), local('Yu Mincho'); }\n@font-face { font-family: 'Noto Serif JP'; font-style: normal; font-weight: 700; src: local('Yu Mincho Demibold'), local('YuMincho-Demibold'), local('Yu Mincho'); }\n\u003c/style\u003e\n  \u003cscript src=\"91b1e5ac-bd8c-4043-9218-13a97786ccd2\"\u003e\u003c/script\u003e\n  \u003cstyle\u003e\n    body { margin: 0; background: #222; font-family: 'Noto Sans JP', sans-serif; }\n  \u003c/style\u003e\n\u003c/helmet\u003e\n\n\u003cx-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\"\u003e\n\n  \u003c!-- ═══ 01 タイトル ═══ --\u003e\n  \u003csection data-label=\"タイトル\" data-speaker-notes=\"本日は、基幹システム刷新とDX推進の全体計画についてご報告します。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; right: 0; top: 0; bottom: 0; width: 560px; background: #0E4F4F;\"\u003e\u003c/div\u003e\n    \u003cdiv style=\"position: absolute; right: 480px; top: 200px; bottom: 200px; width: 160px; background: #1A7A6E; opacity: 0.5;\"\u003e\u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 140px; top: 280px; display: flex; flex-direction: column; gap: 44px; max-width: 1100px;\"\u003e\n      \u003cspan style=\"font-size: 27px; font-weight: 500; color: #1A7A6E; letter-spacing: 6px;\"\u003e経営会議報告資料\u003c/span\u003e\n      \u003ch1 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 76px; font-weight: 700; color: #17332F; line-height: 1.35;\"\u003eDX推進に向けた\u003cbr\u003eシステム刷新計画\u003c/h1\u003e\n      \u003cp style=\"margin: 0; font-size: 29px; color: #33403B; line-height: 1.7;\"\u003e基幹システムのAIパッケージ移行による構造改革\u003cbr\u003e― 投資判断のご審議事項 ―\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 140px; bottom: 100px; display: flex; gap: 48px; align-items: baseline;\"\u003e\n      \u003cspan style=\"font-size: 30px; font-weight: 700; color: #17332F; white-space: nowrap;\"\u003e情報システム部\u003c/span\u003e\n      \u003cspan style=\"font-size: 28px; color: #7A8580;\"\u003e2026年7月2日\u003c/span\u003e\n    \u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 02 目次 ═══ --\u003e\n  \u003csection data-label=\"目次\" data-speaker-notes=\"本日のアジェンダです。現状の課題認識から始め、刷新方針、費用対効果、移行ロードマップの順にご説明します。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 100px; display: flex; flex-direction: column; gap: 18px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003eAGENDA\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 48px; font-weight: 700; color: #17332F;\"\u003e目次\u003c/h2\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; top: 300px; display: flex; flex-direction: column;\"\u003e\n      \u003cdiv style=\"display: flex; align-items: baseline; gap: 48px; padding: 32px 24px; border-bottom: 1px solid #C9D3CE;\"\u003e\n        \u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 36px; font-weight: 700; color: #1A7A6E; width: 72px;\"\u003e01\u003c/span\u003e\n        \u003cspan style=\"font-size: 32px; font-weight: 700; color: #17332F;\"\u003e背景と課題認識\u003c/span\u003e\n        \u003cspan style=\"font-size: 26px; color: #7A8580; margin-left: auto;\"\u003e現行システムの構造的な限界と事業影響\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: flex; align-items: baseline; gap: 48px; padding: 32px 24px; border-bottom: 1px solid #C9D3CE;\"\u003e\n        \u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 36px; font-weight: 700; color: #1A7A6E; width: 72px;\"\u003e02\u003c/span\u003e\n        \u003cspan style=\"font-size: 32px; font-weight: 700; color: #17332F;\"\u003e刷新の基本方針\u003c/span\u003e\n        \u003cspan style=\"font-size: 26px; color: #7A8580; margin-left: auto;\"\u003eFit to Standard・段階移行・AI内製化の3原則\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: flex; align-items: baseline; gap: 48px; padding: 32px 24px; border-bottom: 1px solid #C9D3CE;\"\u003e\n        \u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 36px; font-weight: 700; color: #1A7A6E; width: 72px;\"\u003e03\u003c/span\u003e\n        \u003cspan style=\"font-size: 32px; font-weight: 700; color: #17332F;\"\u003eコスト分析と移行方式の比較\u003c/span\u003e\n        \u003cspan style=\"font-size: 26px; color: #7A8580; margin-left: auto;\"\u003e運用コスト推移・3方式の定量評価\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: flex; align-items: baseline; gap: 48px; padding: 32px 24px; border-bottom: 1px solid #C9D3CE;\"\u003e\n        \u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 36px; font-weight: 700; color: #1A7A6E; width: 72px;\"\u003e04\u003c/span\u003e\n        \u003cspan style=\"font-size: 32px; font-weight: 700; color: #17332F;\"\u003e移行ロードマップと推進体制\u003c/span\u003e\n        \u003cspan style=\"font-size: 26px; color: #7A8580; margin-left: auto;\"\u003e3フェーズ・24ヶ月の実行計画とマイルストーン\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: flex; align-items: baseline; gap: 48px; padding: 32px 24px;\"\u003e\n        \u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 36px; font-weight: 700; color: #1A7A6E; width: 72px;\"\u003e05\u003c/span\u003e\n        \u003cspan style=\"font-size: 32px; font-weight: 700; color: #17332F;\"\u003eAppendix\u003c/span\u003e\n        \u003cspan style=\"font-size: 26px; color: #7A8580; margin-left: auto;\"\u003eコスト試算の前提条件・評価基準の詳細\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; bottom: 130px; display: flex; align-items: center; gap: 28px; border-top: 2px solid #C9D3CE; padding-top: 30px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 700; color: #FDFDFB; background: #0E4F4F; padding: 8px 24px; border-radius: 6px; white-space: nowrap;\"\u003e本日のご審議事項\u003c/span\u003e\n      \u003cspan style=\"font-size: 27px; font-weight: 500; color: #17332F;\"\u003eAIパッケージ導入方式による刷新への着手承認、および初年度投資予算 12.0億円のご承認\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003eDX推進に向けたシステム刷新計画\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 03 テキスト① 背景と課題 ═══ --\u003e\n  \u003csection data-label=\"背景と課題\" data-speaker-notes=\"現行基幹システムは稼働から15年が経過し、3つの構造的課題を抱えています。定量データとあわせてご説明します。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 70px; right: 100px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003e01　背景と課題認識\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 46px; font-weight: 700; color: #17332F;\"\u003eレガシーシステムが事業のスピードを制約している\u003c/h2\u003e\n      \u003cp style=\"margin: 0; font-size: 27px; color: #33403B; line-height: 1.6;\"\u003e稼働15年を経た現行基幹システムは、改修対応力・保守体制・データ活用の3側面で構造的な限界に達している\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; top: 295px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 40px;\"\u003e\n      \u003cdiv style=\"background: #EFF4F1; border-radius: 12px; padding: 26px 34px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n        \u003cdiv style=\"display: flex; align-items: baseline; gap: 20px;\"\u003e\u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 34px; font-weight: 700; color: #1A7A6E;\"\u003e01\u003c/span\u003e\u003cspan style=\"font-size: 31px; font-weight: 700; color: #17332F;\"\u003e改修リードタイムの長期化\u003c/span\u003e\u003c/div\u003e\n        \u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.7;\"\u003e密結合な構造により影響調査に膨大な工数を要し、事業部門の要望に即応できない。\u003c/span\u003e\n        \u003cdiv style=\"height: 1px; background: #C9D3CE;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 12px;\"\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e制度対応の平均リードタイム \u003cb style=\"color: #0E4F4F;\"\u003e4.2ヶ月\u003c/b\u003e（業界平均の約2倍）\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e改修工数の \u003cb style=\"color: #0E4F4F;\"\u003e47%\u003c/b\u003e が影響調査・回帰テストに費消\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e改修案件の滞留件数は直近3年で \u003cb style=\"color: #0E4F4F;\"\u003e2.3倍\u003c/b\u003e に増加\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"background: #EFF4F1; border-radius: 12px; padding: 26px 34px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n        \u003cdiv style=\"display: flex; align-items: baseline; gap: 20px;\"\u003e\u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 34px; font-weight: 700; color: #1A7A6E;\"\u003e02\u003c/span\u003e\u003cspan style=\"font-size: 31px; font-weight: 700; color: #17332F;\"\u003e保守体制の持続性リスク\u003c/span\u003e\u003c/div\u003e\n        \u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.7;\"\u003eCOBOL有識者の減少が続き、属人化した保守ノウハウの継承が困難になりつつある。\u003c/span\u003e\n        \u003cdiv style=\"height: 1px; background: #C9D3CE;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 12px;\"\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e社内有識者 \u003cb style=\"color: #0E4F4F;\"\u003e12名 → 5名\u003c/b\u003e（2030年見込み・平均年齢54歳）\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003eベンダー保守単価は直近3年で \u003cb style=\"color: #0E4F4F;\"\u003e+28%\u003c/b\u003e 上昇\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003eHW保守は \u003cb style=\"color: #0E4F4F;\"\u003e2029年でEOL\u003c/b\u003e、延長保守は年1.4億円\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"background: #EFF4F1; border-radius: 12px; padding: 26px 34px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n        \u003cdiv style=\"display: flex; align-items: baseline; gap: 20px;\"\u003e\u003cspan style=\"font-family: 'Noto Serif JP', serif; font-size: 34px; font-weight: 700; color: #1A7A6E;\"\u003e03\u003c/span\u003e\u003cspan style=\"font-size: 31px; font-weight: 700; color: #17332F;\"\u003eデータ活用の阻害\u003c/span\u003e\u003c/div\u003e\n        \u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.7;\"\u003eデータが業務ごとのサイロに分散し、全社横断の分析やAI活用の基盤を構築できない。\u003c/span\u003e\n        \u003cdiv style=\"height: 1px; background: #C9D3CE;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 12px;\"\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e顧客マスタが \u003cb style=\"color: #0E4F4F;\"\u003e4系統\u003c/b\u003e に分散、名寄せは手作業\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e分析用データ連携の個別開発が \u003cb style=\"color: #0E4F4F;\"\u003e年30件超\u003c/b\u003e 発生\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003eAI・BI活用は部門PoC止まりで \u003cb style=\"color: #0E4F4F;\"\u003e全社展開ゼロ\u003c/b\u003e\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; bottom: 120px; display: flex; align-items: center; gap: 28px; border-top: 2px solid #C9D3CE; padding-top: 28px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 700; color: #FDFDFB; background: #0E4F4F; padding: 8px 24px; border-radius: 6px; white-space: nowrap;\"\u003e示唆\u003c/span\u003e\n      \u003cspan style=\"font-size: 27px; font-weight: 500; color: #17332F; line-height: 1.6;\"\u003e部分改修による延命では構造的課題は解消せず、HW保守期限（2029年）から逆算すると刷新着手の判断時期は今期が実質的な期限となる\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003e出所：情報システム部 保守実績データ（FY23–FY25）、ベンダーヒアリング（2026年5月）\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 04 テキスト② 刷新方針 ═══ --\u003e\n  \u003csection data-label=\"刷新方針\" data-speaker-notes=\"刷新の基本方針は3点。標準機能への業務適合、段階的な移行、AI活用の内製化です。それぞれ具体策と期待効果を定めています。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 70px; right: 100px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003e02　刷新の基本方針\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 46px; font-weight: 700; color: #17332F;\"\u003eAIパッケージの標準機能を軸に、段階的に移行する\u003c/h2\u003e\n      \u003cp style=\"margin: 0; font-size: 27px; color: #33403B; line-height: 1.6;\"\u003e「作る」から「使いこなす」への転換を3つの原則で徹底し、刷新後も陳腐化しない基盤を実現する\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; top: 300px; display: flex; flex-direction: column;\"\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 320px 1fr 380px; border-bottom: 2px solid #17332F;\"\u003e\n        \u003cdiv style=\"padding: 14px 24px; font-size: 25px; font-weight: 700; color: #7A8580;\"\u003e基本方針\u003c/div\u003e\n        \u003cdiv style=\"padding: 14px 24px; font-size: 25px; font-weight: 700; color: #7A8580;\"\u003e具体的な取り組み\u003c/div\u003e\n        \u003cdiv style=\"padding: 14px 24px; font-size: 25px; font-weight: 700; color: #7A8580;\"\u003e期待効果（KPI）\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 320px 1fr 380px; border-bottom: 1px solid #C9D3CE; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; border-right: 3px solid #1A7A6E;\"\u003e\n          \u003cspan style=\"font-size: 23px; color: #7A8580; letter-spacing: 2px;\"\u003e方針 1\u003c/span\u003e\n          \u003cspan style=\"font-size: 31px; font-weight: 700; color: #0E4F4F; white-space: nowrap;\"\u003eFit to Standard\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"padding: 28px 32px; display: flex; flex-direction: column; gap: 10px;\"\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e業務プロセスをパッケージ標準に適合させる（BPRを併走）\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003eアドオン開発は全体の10%以下に抑制、例外はCIO承認制\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e半期ごとのバージョンアップへ自動追随し陳腐化を防止\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 4px; background: #EFF4F1; border-radius: 12px; margin: 14px 0;\"\u003e\n          \u003cspan style=\"font-size: 25px; color: #33403B;\"\u003e制度対応リードタイム\u003c/span\u003e\n          \u003cspan style=\"font-size: 31px; font-weight: 900; color: #0E4F4F;\"\u003e4.2ヶ月 → 0.8ヶ月\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 320px 1fr 380px; border-bottom: 1px solid #C9D3CE; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; border-right: 3px solid #1A7A6E;\"\u003e\n          \u003cspan style=\"font-size: 23px; color: #7A8580; letter-spacing: 2px;\"\u003e方針 2\u003c/span\u003e\n          \u003cspan style=\"font-size: 31px; font-weight: 700; color: #0E4F4F; white-space: nowrap;\"\u003e段階的移行\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"padding: 28px 32px; display: flex; flex-direction: column; gap: 10px;\"\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e業務領域ごとに3フェーズで移行し、一括切替は行わない\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e各フェーズで3ヶ月の並行稼働と事前定義したGo/No-Go判定を実施\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e旧システムはフェーズ完了ごとに縮退し二重運用費を最小化\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 4px; background: #EFF4F1; border-radius: 12px; margin: 14px 0;\"\u003e\n          \u003cspan style=\"font-size: 25px; color: #33403B;\"\u003e切替に伴う業務停止\u003c/span\u003e\n          \u003cspan style=\"font-size: 31px; font-weight: 900; color: #0E4F4F;\"\u003e0日（計画値）\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 320px 1fr 380px; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; border-right: 3px solid #1A7A6E;\"\u003e\n          \u003cspan style=\"font-size: 23px; color: #7A8580; letter-spacing: 2px;\"\u003e方針 3\u003c/span\u003e\n          \u003cspan style=\"font-size: 31px; font-weight: 700; color: #0E4F4F; white-space: nowrap;\"\u003eAI活用の内製化\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"padding: 28px 32px; display: flex; flex-direction: column; gap: 10px;\"\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e需要予測・自動仕訳などパッケージ標準AI機能から順次適用\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003e全トランザクションを統合データ基盤に集約し分析を標準化\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.6;\"\u003ePMO内にAI推進チーム（3名）を常設し、部門への展開を主導\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"padding: 28px 24px; display: flex; flex-direction: column; gap: 4px; background: #EFF4F1; border-radius: 12px; margin: 14px 0;\"\u003e\n          \u003cspan style=\"font-size: 25px; color: #33403B;\"\u003e経理・受発注の定型業務工数\u003c/span\u003e\n          \u003cspan style=\"font-size: 31px; font-weight: 900; color: #0E4F4F;\"\u003e▲30%（FY29）\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003e注：KPIはベンダー提供の導入実績値および社内工数実績に基づく試算値\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 05 グラフ① コスト推移 ═══ --\u003e\n  \u003csection data-label=\"コスト推移\" data-speaker-notes=\"現行システムの保守運用費は5年で1.6倍に増加。IT予算の78%が維持費に消えており、投資余力を圧迫しています。増加要因は緊急保守と単価上昇です。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 70px; right: 100px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003e03　コスト分析\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 46px; font-weight: 700; color: #17332F;\"\u003e運用コストは5年で1.6倍に増加し、投資原資を圧迫\u003c/h2\u003e\n      \u003cp style=\"margin: 0; font-size: 27px; color: #33403B; line-height: 1.6;\"\u003e維持費がIT予算の8割弱を占め、このまま推移すればFY28には戦略投資の予算枠が実質ゼロとなる\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 320px; right: 100px; bottom: 170px; display: flex; gap: 72px;\"\u003e\n      \u003cdiv style=\"flex: 1.4; display: flex; flex-direction: column; gap: 16px;\"\u003e\n        \u003cspan style=\"font-size: 26px; font-weight: 700; color: #17332F;\"\u003e現行システム保守運用費の推移（億円）\u003c/span\u003e\n        \u003cdiv style=\"flex: 1; display: flex; align-items: flex-end; gap: 44px; border-bottom: 2px solid #C9D3CE; padding: 0 24px;\"\u003e\n          \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;\"\u003e\u003cspan style=\"font-size: 27px; font-weight: 700; color: #7A8580;\"\u003e4.2\u003c/span\u003e\u003cdiv style=\"width: 100%; height: 220px; background: #D4E3DD; border-radius: 6px 6px 0 0;\"\u003e\u003c/div\u003e\u003cspan style=\"font-size: 25px; color: #7A8580; margin-bottom: -46px;\"\u003eFY22\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;\"\u003e\u003cspan style=\"font-size: 27px; font-weight: 700; color: #7A8580;\"\u003e4.9\u003c/span\u003e\u003cdiv style=\"width: 100%; height: 262px; background: #AFCCC2; border-radius: 6px 6px 0 0;\"\u003e\u003c/div\u003e\u003cspan style=\"font-size: 25px; color: #7A8580; margin-bottom: -46px;\"\u003eFY23\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;\"\u003e\u003cspan style=\"font-size: 27px; font-weight: 700; color: #7A8580;\"\u003e5.5\u003c/span\u003e\u003cdiv style=\"width: 100%; height: 296px; background: #6FA79A; border-radius: 6px 6px 0 0;\"\u003e\u003c/div\u003e\u003cspan style=\"font-size: 25px; color: #7A8580; margin-bottom: -46px;\"\u003eFY24\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;\"\u003e\u003cspan style=\"font-size: 27px; font-weight: 700; color: #7A8580;\"\u003e6.1\u003c/span\u003e\u003cdiv style=\"width: 100%; height: 330px; background: #3D8578; border-radius: 6px 6px 0 0;\"\u003e\u003c/div\u003e\u003cspan style=\"font-size: 25px; color: #7A8580; margin-bottom: -46px;\"\u003eFY25\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px;\"\u003e\u003cspan style=\"font-size: 29px; font-weight: 900; color: #0E4F4F;\"\u003e6.7\u003c/span\u003e\u003cdiv style=\"width: 100%; height: 364px; background: #0E4F4F; border-radius: 6px 6px 0 0;\"\u003e\u003c/div\u003e\u003cspan style=\"font-size: 25px; font-weight: 700; color: #17332F; margin-bottom: -46px;\"\u003eFY26予\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cspan style=\"font-size: 24px; color: #7A8580; padding-top: 40px;\"\u003e内訳：ベンダー保守費・インフラ費・運用人件費の合計\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; gap: 24px; justify-content: flex-start; padding-top: 44px;\"\u003e\n        \u003cdiv style=\"display: flex; gap: 24px;\"\u003e\n          \u003cdiv style=\"flex: 1; background: #EFF4F1; border-radius: 12px; padding: 28px 32px; display: flex; flex-direction: column; gap: 6px;\"\u003e\u003cspan style=\"font-size: 46px; font-weight: 900; color: #0E4F4F;\"\u003e+60%\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.5;\"\u003e保守運用費の\u003cbr\u003e5年間増加率\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"flex: 1; background: #EFF4F1; border-radius: 12px; padding: 28px 32px; display: flex; flex-direction: column; gap: 6px;\"\u003e\u003cspan style=\"font-size: 46px; font-weight: 900; color: #17332F;\"\u003e78%\u003c/span\u003e\u003cspan style=\"font-size: 26px; color: #33403B; line-height: 1.5;\"\u003eIT予算に占める\u003cbr\u003e維持費比率\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"border: 2px solid #C9D3CE; border-radius: 12px; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n          \u003cspan style=\"font-size: 27px; font-weight: 700; color: #17332F;\"\u003e増加の主要因\u003c/span\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003e老朽化に伴う緊急保守対応が年率 \u003cb style=\"color: #0E4F4F;\"\u003e+18%\u003c/b\u003e で増加\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003eCOBOL技術者の希少化による保守単価上昇（3年で+28%）\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv style=\"display: flex; gap: 14px; align-items: baseline;\"\u003e\u003cspan style=\"color: #1A7A6E; font-size: 24px;\"\u003e▪\u003c/span\u003e\u003cspan style=\"font-size: 25px; color: #33403B; line-height: 1.6;\"\u003eEOL対応のHW延長保守費（FY27以降 年1.4億円）\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003e出所：情報システム部 IT予算実績（FY22–FY25）、FY26は予算計画値\u003c/span\u003e\u003cspan\u003e5\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 06 比較表 ═══ --\u003e\n  \u003csection data-label=\"移行方式比較\" data-speaker-notes=\"3つの移行方式を6つの評価軸で比較しました。AIパッケージ導入は5年総コスト・課題解消・AI適合性で優位であり、総合評価として推奨します。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 70px; right: 100px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003e03　移行方式の比較\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 46px; font-weight: 700; color: #17332F;\"\u003e3方式のうちAIパッケージ導入が総合評価で優位\u003c/h2\u003e\n      \u003cp style=\"margin: 0; font-size: 27px; color: #33403B; line-height: 1.6;\"\u003e5年総コスト・構造課題の解消・AI活用適合性の3点で他方式を上回り、投資回収は5.2年と試算\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; top: 300px; display: grid; grid-template-columns: 280px 1fr 1fr 1fr; font-size: 26px;\"\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 3px solid #17332F;\"\u003e\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 3px solid #17332F; text-align: center; font-weight: 700; color: #33403B;\"\u003e案A：フルスクラッチ開発\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 3px solid #0E4F4F; text-align: center; font-weight: 700; color: #FDFDFB; background: #0E4F4F; border-radius: 12px 12px 0 0;\"\u003e案B：AIパッケージ導入\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 3px solid #17332F; text-align: center; font-weight: 700; color: #33403B;\"\u003e案C：現行システム改修\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F;\"\u003e初期投資\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e△　18.5億円\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #17332F; font-weight: 700; background: #EFF4F1;\"\u003e○　12.0億円\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e◎　6.2億円\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F;\"\u003e5年間総コスト（TCO）\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e△　32.1億円\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #17332F; font-weight: 700; background: #EFF4F1;\"\u003e◎　21.4億円\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e○　28.8億円\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F;\"\u003e移行期間\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e△　36ヶ月以上\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #17332F; font-weight: 700; background: #EFF4F1;\"\u003e○　24ヶ月\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e◎　12ヶ月\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F;\"\u003e構造的課題の解消\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e◎　全面解消\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #17332F; font-weight: 700; background: #EFF4F1;\"\u003e◎　全面解消\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e×　課題残存\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F;\"\u003eAI・データ活用適合性\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e○　個別構築が必要\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #17332F; font-weight: 700; background: #EFF4F1;\"\u003e◎　標準AI機能を内蔵\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e△　基盤分離のまま\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F;\"\u003e主要リスク\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e開発長期化・要員確保\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #17332F; font-weight: 700; background: #EFF4F1;\"\u003e業務側の標準化受容\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 20px; border-bottom: 1px solid #C9D3CE; text-align: center; color: #33403B;\"\u003e2030年問題の先送り\u003c/div\u003e\n\n      \u003cdiv style=\"padding: 20px; font-weight: 700; color: #17332F;\"\u003e総合評価\u003c/div\u003e\n      \u003cdiv style=\"padding: 20px; text-align: center; color: #33403B; font-weight: 700;\"\u003e△\u003c/div\u003e\n      \u003cdiv style=\"padding: 20px; text-align: center; color: #FDFDFB; font-weight: 900; font-size: 32px; background: #0E4F4F; border-radius: 0 0 12px 12px;\"\u003e◎　推奨\u003c/div\u003e\n      \u003cdiv style=\"padding: 20px; text-align: center; color: #33403B; font-weight: 700;\"\u003e△\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003e注：◎=優位　○=許容　△=課題あり　×=不可。金額はベンダー2社見積の平均に基づく5年TCO試算（詳細はAppendix参照）\u003c/span\u003e\u003cspan\u003e6\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 07 ロードマップ ═══ --\u003e\n  \u003csection data-label=\"ロードマップ\" data-speaker-notes=\"移行は3フェーズ・24ヶ月。FY27上期に会計領域から着手し、FY28下期に全面移行を完了します。全期間を通じてチェンジマネジメントを並走させます。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 70px; right: 100px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003e04　移行ロードマップ\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 46px; font-weight: 700; color: #17332F;\"\u003e3フェーズ・24ヶ月で全面移行を完了する\u003c/h2\u003e\n      \u003cp style=\"margin: 0; font-size: 27px; color: #33403B; line-height: 1.6;\"\u003eリスクの低い会計領域から着手して方法論を確立し、後続フェーズへ横展開。教育・定着化は全期間で並走\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; top: 300px; display: flex; flex-direction: column;\"\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 300px 1fr 1fr 1fr 1fr; border-bottom: 3px solid #17332F;\"\u003e\n        \u003cdiv style=\"padding: 16px 24px;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"padding: 16px 24px; text-align: center; font-size: 27px; font-weight: 700; color: #17332F; border-left: 1px solid #C9D3CE;\"\u003eFY27 上期\u003c/div\u003e\n        \u003cdiv style=\"padding: 16px 24px; text-align: center; font-size: 27px; font-weight: 700; color: #17332F; border-left: 1px solid #C9D3CE;\"\u003eFY27 下期\u003c/div\u003e\n        \u003cdiv style=\"padding: 16px 24px; text-align: center; font-size: 27px; font-weight: 700; color: #17332F; border-left: 1px solid #C9D3CE;\"\u003eFY28 上期\u003c/div\u003e\n        \u003cdiv style=\"padding: 16px 24px; text-align: center; font-size: 27px; font-weight: 700; color: #17332F; border-left: 1px solid #C9D3CE;\"\u003eFY28 下期\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 300px 1fr 1fr 1fr 1fr; border-bottom: 1px solid #C9D3CE; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 26px 24px; display: flex; flex-direction: column; gap: 4px;\"\u003e\u003cspan style=\"font-size: 23px; color: #7A8580;\"\u003ePhase 1\u003c/span\u003e\u003cspan style=\"font-size: 29px; font-weight: 700; color: #17332F;\"\u003e会計・経理領域\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv style=\"grid-column: 2 / 4; padding: 26px 16px; border-left: 1px solid #C9D3CE;\"\u003e\u003cdiv style=\"background: #0E4F4F; border-radius: 8px; padding: 12px 26px; color: #FDFDFB; font-size: 25px; font-weight: 700;\"\u003e要件定義 → 導入・テスト → 並行稼働（3ヶ月）\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv style=\"border-left: 1px solid #C9D3CE; height: 100%;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"border-left: 1px solid #C9D3CE; height: 100%;\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 300px 1fr 1fr 1fr 1fr; border-bottom: 1px solid #C9D3CE; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 26px 24px; display: flex; flex-direction: column; gap: 4px;\"\u003e\u003cspan style=\"font-size: 23px; color: #7A8580;\"\u003ePhase 2\u003c/span\u003e\u003cspan style=\"font-size: 29px; font-weight: 700; color: #17332F;\"\u003e販売・在庫領域\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv style=\"border-left: 1px solid #C9D3CE; height: 100%;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"grid-column: 3 / 5; padding: 26px 16px; border-left: 1px solid #C9D3CE;\"\u003e\u003cdiv style=\"background: #3D8578; border-radius: 8px; padding: 12px 26px; color: #FDFDFB; font-size: 25px; font-weight: 700;\"\u003e導入 → データ移行（AI変換） → 切替\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv style=\"border-left: 1px solid #C9D3CE; height: 100%;\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 300px 1fr 1fr 1fr 1fr; border-bottom: 1px solid #C9D3CE; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 26px 24px; display: flex; flex-direction: column; gap: 4px;\"\u003e\u003cspan style=\"font-size: 23px; color: #7A8580;\"\u003ePhase 3\u003c/span\u003e\u003cspan style=\"font-size: 29px; font-weight: 700; color: #17332F;\"\u003eAI活用・分析基盤\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv style=\"border-left: 1px solid #C9D3CE; height: 100%;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"border-left: 1px solid #C9D3CE; height: 100%;\"\u003e\u003c/div\u003e\n        \u003cdiv style=\"grid-column: 4 / 6; padding: 26px 16px; border-left: 1px solid #C9D3CE;\"\u003e\u003cdiv style=\"background: #6FA79A; border-radius: 8px; padding: 12px 26px; color: #FDFDFB; font-size: 25px; font-weight: 700;\"\u003eデータ基盤構築 → AI機能の全社展開\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: grid; grid-template-columns: 300px 1fr 1fr 1fr 1fr; border-bottom: 1px solid #C9D3CE; align-items: center;\"\u003e\n        \u003cdiv style=\"padding: 26px 24px; display: flex; flex-direction: column; gap: 4px;\"\u003e\u003cspan style=\"font-size: 23px; color: #7A8580;\"\u003e共通施策\u003c/span\u003e\u003cspan style=\"font-size: 29px; font-weight: 700; color: #17332F;\"\u003e教育・定着化\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv style=\"grid-column: 2 / 6; padding: 26px 16px; border-left: 1px solid #C9D3CE;\"\u003e\u003cdiv style=\"border: 2px solid #1A7A6E; border-radius: 8px; padding: 10px 26px; color: #0E4F4F; font-size: 25px; font-weight: 700;\"\u003eチェンジマネジメント／キーユーザー教育／ヘルプデスク（全期間並走）\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: flex; gap: 24px; align-items: center; padding: 30px 24px 0;\"\u003e\n        \u003cspan style=\"font-size: 26px; font-weight: 700; color: #FDFDFB; background: #0E4F4F; padding: 8px 24px; border-radius: 6px; white-space: nowrap;\"\u003eマイルストーン\u003c/span\u003e\n        \u003cspan style=\"font-size: 27px; color: #33403B;\"\u003eFY27下期：会計領域 本稼働　／　FY28上期：販売・在庫 切替完了　／　FY28下期：現行システム全面停止・刷新完了\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003e注：各フェーズのGo/No-Go判定は経営会議に報告。判定基準の詳細はAppendix参照\u003c/span\u003e\u003cspan\u003e7\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 08 Appendix扉 ═══ --\u003e\n  \u003csection data-label=\"Appendix\" data-speaker-notes=\"以降は補足資料です。\" style=\"background: #0E4F4F; position: relative; overflow: hidden;\"\u003e\n    \u003cdiv style=\"position: absolute; left: 140px; top: 440px; display: flex; flex-direction: column; gap: 36px;\"\u003e\n      \u003cdiv style=\"width: 80px; height: 6px; background: #6FA79A;\"\u003e\u003c/div\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 84px; font-weight: 700; color: #FDFDFB;\"\u003eAppendix\u003c/h2\u003e\n      \u003cspan style=\"font-size: 34px; color: #AFCCC2;\"\u003e前提条件・試算根拠\u003c/span\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; right: 140px; bottom: 100px; font-family: 'Noto Serif JP', serif; font-size: 200px; font-weight: 700; color: #1A7A6E; opacity: 0.4; line-height: 1;\"\u003eA\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003c!-- ═══ 09 Appendix 前提条件 ═══ --\u003e\n  \u003csection data-label=\"前提条件\" data-speaker-notes=\"コスト試算の前提条件一覧です。ご質問があればこちらで補足します。\" style=\"background: #FDFDFB; position: relative; overflow: hidden;\" data-comment-anchor=\"ada86e1558-section\"\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; top: 70px; right: 100px; display: flex; flex-direction: column; gap: 14px;\"\u003e\n      \u003cspan style=\"font-size: 26px; font-weight: 500; color: #1A7A6E; letter-spacing: 4px;\"\u003eAPPENDIX\u003c/span\u003e\n      \u003ch2 style=\"margin: 0; font-family: 'Noto Serif JP', serif; font-size: 46px; font-weight: 700; color: #17332F;\"\u003eコスト試算の前提条件\u003c/h2\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; right: 100px; top: 255px; display: grid; grid-template-columns: 380px 1fr; font-size: 26px;\"\u003e\n      \u003cdiv style=\"padding: 18px 24px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F; background: #EFF4F1;\"\u003e対象範囲\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 32px; border-bottom: 1px solid #C9D3CE; color: #33403B; line-height: 1.6;\"\u003e会計・販売・在庫・人事の基幹4領域（約1,200機能）。周辺の個別業務システム28本は対象外とし、標準API連携で接続する。\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 24px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F; background: #EFF4F1;\"\u003eライセンス費用\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 32px; border-bottom: 1px solid #C9D3CE; color: #33403B; line-height: 1.6;\"\u003e利用ユーザー数1,200名・SaaS型サブスクリプションで試算。年間契約・3年コミットの割引（▲12%）を適用。AI機能は標準ライセンスに含まれる。\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 24px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F; background: #EFF4F1;\"\u003e導入・移行費用\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 32px; border-bottom: 1px solid #C9D3CE; color: #33403B; line-height: 1.6;\"\u003eベンダー2社（大手SIer・パッケージベンダー直販）の概算見積の平均値。データ移行はAI変換ツールによる自動化率70%を前提とし、残余は手動移行・検証工数として計上。\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 24px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F; background: #EFF4F1;\"\u003e推進体制\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 32px; border-bottom: 1px solid #C9D3CE; color: #33403B; line-height: 1.6;\"\u003e社内PMO 5名＋業務部門キーユーザー12名（兼務50%）＋外部支援。Phase 2以降は外部依存率を60%→35%に段階的に引き下げ、内製化を進める。\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 24px; border-bottom: 1px solid #C9D3CE; font-weight: 700; color: #17332F; background: #EFF4F1;\"\u003e効果試算\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 32px; border-bottom: 1px solid #C9D3CE; color: #33403B; line-height: 1.6;\"\u003e定型業務工数▲30%は、ベンダー導入実績（同業種・同規模5社の平均）に社内の対象業務工数（年間延べ84,000時間）を乗じて算出。投資回収期間は5.2年。\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 24px; font-weight: 700; color: #17332F; background: #EFF4F1;\"\u003e為替・物価\u003c/div\u003e\n      \u003cdiv style=\"padding: 18px 32px; color: #33403B; line-height: 1.6;\"\u003e2026年6月時点のレート・単価を使用。物価変動は年率2%で織り込み済み。海外製パッケージのため為替感応度は±10%で別途シナリオ分析を実施。\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"position: absolute; left: 100px; bottom: 50px; right: 100px; display: flex; justify-content: space-between; font-size: 24px; color: #9AA5A0;\"\u003e\u003cspan\u003e出所：ベンダー見積（2026年5月）、情報システム部試算\u003c/span\u003e\u003cspan\u003e9\u003c/span\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n\u003c/x-import\u003e\n\u003c/x-dc\u003e\n\n\n\u003c/body\u003e\u003c/html\u003e"</script>
