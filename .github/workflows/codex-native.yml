name: Codex native harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .codex/scripts/check-native.mjs
